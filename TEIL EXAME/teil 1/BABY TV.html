    .results-header {

                content: "Fernsehen ist der Sprachentwicklung bei Kleinkindern nicht förderlich. Sie sind bunt und lustig, die Teletubbys, die am Bildschirm auch deutsche Kinder beglücken. Doch gute Sprachlehrer für Babys sind sie nicht - so das Ergebnis einer US-amerikanischen Studie. 'Manche Eltern mögen davon träumen, dass ihre Kinder die ersten Worte beim Fernsehen lernen', sagt eine Linguistin, 'aber das funktioniert nicht.' Die Kommunikationsexpertin hat 48 Kleinkinder im Alter von 5 bis 24 Monaten getestet. Zuerst bekamen sie Gegenstände zu Gesicht, für die sie noch keine Worte hatten - etwa einen Schraubenzieher. Für das gezeigte Objekt erfanden die Forscher dann ein Fantasiewort wie 'Deet'. 'Damit wollten wir sicherstellen, dass die Kinder den Begriff wirklich noch nie gehört hatten', erklärt die Expertin. Dann wurde es fünfmal wiederholt - entweder in einem Teletubby-ähnlichen Video oder direkt von einer anwesenden Person. Nach kurzer Pause legten die Forscher ihren Probanden einige Gegenstände vor und forderten sie auf: 'Zeig mir Deet.' Babys, die das Wort direkt gelernt hatten, reagierten spätestens bei der dritten Wiederholung. Die jungen TV-Seher aber waren meist ratlos.",

              {id: "f", text: "Kinder bekommen immer mehr Medikamente"},
              {id: "g", text: "Studie: Schulkinder treiben zu wenig Sport"},

      let state = { sectionIndex: 0, answers: {}, showResults: false, selectedHeadingId: null };
      let seconds = 0, timerInterval;
      const timerEl = document.getElementById('timer');
      const passageContentEl = document.getElementById('passageContent-lesen');
      const questionBodyEl = document.getElementById('questionBody-lesen');
      const resultBtn = document.getElementById('resultBtn-lesen');
      const resetBtn = document.getElementById('resetBtn-lesen');
      const bodyEl = document.getElementById('body');
      const indicatorContainer = document.getElementById('indicatorContainer');

      function startTimer() { timerInterval = setInterval(() => { seconds++; updateTimerDisplay(); }, 1000); }
      function resetTimer() { seconds = 0; updateTimerDisplay(); }
      function updateTimerDisplay() { const h = Math.floor(seconds/3600), m = Math.floor((seconds%3600)/60), s = seconds%60; timerEl.textContent = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`; }

      function isAllQuestionsAnswered() {
        const totalTexts = exam.sections[0].texts.length;
        const answeredCount = Object.keys(state.answers).length;
        return answeredCount === totalTexts;
      }

      function updateCompletionMode() {
        if (!state.showResults && isAllQuestionsAnswered()) {
          bodyEl.classList.add('completion-mode');
        } else {
          bodyEl.classList.remove('completion-mode');
        }
      }

      function renderIndicators() {
        const texts = exam.sections[0].texts;
        let dotsHtml = '';
        texts.forEach((text, idx) => {
          const isAnswered = Object.values(state.answers).includes(text.id);
          const answeredClass = isAnswered ? 'answered' : '';
          dotsHtml += `<div class="indicator-dot ${answeredClass}" title="Text ${idx+1}">${idx+1}</div>`;
        });
        indicatorContainer.innerHTML = dotsHtml;
      }

      function handleDragStart(e, type, id) {
        if (type === 'heading' && state.answers[id]) { e.preventDefault(); return; } 
        e.dataTransfer.setData('text/plain', JSON.stringify({ type, id }));
      }

      function handleDropOnText(e, textId) {
        e.preventDefault();
        const raw = e.dataTransfer.getData('text/plain');
        if (!raw) return;
        const { type, id } = JSON.parse(raw);
        
        if (type === 'heading') {
          if (state.answers[id] && state.answers[id] !== 'X') return; 
          const existingForText = Object.entries(state.answers).find(([head, val]) => val === textId);
          if (existingForText) return;
          
          if (state.answers[id] === 'X') delete state.answers[id];
          state.answers[id] = textId;
        } 
        else if (type === 'slot') {
          const headingId = id.replace('slot-','');
          if (state.answers[headingId] && state.answers[headingId] !== 'X') {
            delete state.answers[headingId];
          }
        }
        state.selectedHeadingId = null;
        updateCompletionMode();
        renderAll();
      }

      function allowDrop(e) { e.preventDefault(); }

      function handleSlotClick(headingId) {
        if (headingId && state.answers[headingId] && state.answers[headingId] !== 'X') {
          delete state.answers[headingId];
          updateCompletionMode();
          renderAll();
        }
      }

      function handleHeadingClick(headingId) {
        if (state.answers[headingId]) return;
        state.selectedHeadingId = headingId;
        renderAll();
      }

      function handleSlotSelectClick(textId) {
        if (!state.selectedHeadingId) return;
        
        const headingId = state.selectedHeadingId;
        if (state.answers[headingId]) {
          state.selectedHeadingId = null;
          renderAll();
          return;
        }
        
        const existingForText = Object.entries(state.answers).find(([head, val]) => val === textId);
        if (existingForText) {
          const oldHeading = existingForText[0];
          delete state.answers[oldHeading];
        }
        
        state.answers[headingId] = textId;
        state.selectedHeadingId = null;
        
        updateCompletionMode();
        renderAll();
      }

      function renderPart1() {
        const section = exam.sections[0];
        let textsHTML = `<div class="texts-list">`;
        section.texts.forEach((text, idx) => {
          const userHeadingId = Object.keys(state.answers).find(key => state.answers[key] === text.id);
          const headingObj = userHeadingId ? section.headings.find(h => h.id === userHeadingId) : null;
          const slotContent = userHeadingId && headingObj ? `${headingObj.id}) ${headingObj.text}` : (state.selectedHeadingId ? 'Klicken zum Einfügen' : 'Hier ablegen');
          const hasClass = userHeadingId ? 'has-title' : '';
          const draggable = userHeadingId ? 'true' : 'false';
          const slotClickAttr = userHeadingId ? `onclick="window.lesenApp.handleSlotClick('${userHeadingId}')"` : `onclick="window.lesenApp.handleSlotSelectClick('${text.id}')"`;
          
          textsHTML += `
            <div class="text-item" data-text-id="${text.id}">
              <div class="text-letter">Text ${idx+1}</div>
              <div class="text-content">${text.content}</div>
              <div class="title-slot ${hasClass}" 
                   data-text-id="${text.id}"
                   draggable="${draggable}"
                   ondragstart="event.dataTransfer.setData('text/plain', JSON.stringify({type:'slot', id:'slot-${userHeadingId}'}))"
                   ondrop="window.lesenApp.dropOnText(event, '${text.id}')"
                   ondragover="event.preventDefault()"
                   ${slotClickAttr}
                   title="${userHeadingId ? 'Klicken zum Entfernen' : (state.selectedHeadingId ? 'Klicken zum Einfügen' : 'Hier ablegen oder zuerst Überschrift anklicken')}">
                ${slotContent}
              </div>
            </div>`;
        });
        textsHTML += `</div>`;
        passageContentEl.innerHTML = textsHTML;

        let headingsHTML = `<div class="headings-list">`;
        section.headings.forEach(heading => {
          const used = state.answers[heading.id] && state.answers[heading.id] !== 'X';
          const selectedClass = (state.selectedHeadingId === heading.id) ? 'selected-heading' : '';
          headingsHTML += `
            <div class="heading-item ${used ? 'used' : ''} ${selectedClass}" 
                 data-heading-id="${heading.id}"
                 draggable="${!used}"
                 ondragstart="window.lesenApp.dragStart(event, 'heading', '${heading.id}')"
                 onclick="window.lesenApp.handleHeadingClick('${heading.id}')">
              <div class="heading-letter">${heading.id})</div>
              <div class="heading-text">${heading.text}</div>
            </div>`;
        });
        headingsHTML += `</div>`;
        questionBodyEl.innerHTML = headingsHTML;
        
        renderIndicators();
      }

      function renderResultsLeft() {
        const section = exam.sections[0];
        let totalCorrect = 0;
        let total = section.texts.length;
        
        let html = `
          <div class="results-container">
            <div class="results-header">
              <h2>Prüfungsauswertung</h2>
              <div class="results-summary-badge">${Object.keys(state.answers).length}/${total} beantwortet</div>
            </div>
            <div class="result-grid">
        `;
        
        section.texts.forEach((text, idx) => {
          const userHeadingId = Object.keys(state.answers).find(key => state.answers[key] === text.id);
          const user = userHeadingId ? userHeadingId : '—';
          const correct = text.correctAnswer;
          const isCorrect = (user === correct);
          if (isCorrect) totalCorrect++;
          
          html += `
            <div class="result-card ${isCorrect ? 'correct' : 'incorrect'}">
              <div class="result-card-info">
                <span class="text-tag">Text ${idx+1}</span>
              </div>
              <div class="result-answer-badge">
                <span class="user-answer">${user}</span>
                <span class="correct-answer">soll: ${correct}</span>
                <span class="verdict-badge ${isCorrect ? 'correct' : 'incorrect'}">${isCorrect ? 'richtig' : 'falsch'}</span>
              </div>
            </div>
          `;
        });
        
        html += `</div></div>`;
        passageContentEl.innerHTML = html;
        indicatorContainer.innerHTML = '';
        return { totalCorrect, total };
      }

      function renderResultsRight(totalCorrect, total) {
        const wrong = total - totalCorrect;
        const percent = Math.round((totalCorrect/total)*100);
        const stars = '★'.repeat(Math.max(1, Math.floor(percent/20)));
        const passed = percent >= 60;
        
        const rightHTML = `
          <div class="summary-container">
            <div class="summary-card">
              <div class="summary-title">Gesamtergebnis</div>
              <div class="summary-score">${totalCorrect}<small>/${total}</small></div>
              <div class="summary-stats">
                <div class="stat-item">
                  <div class="stat-label">Richtig</div>
                  <div class="stat-value correct">${totalCorrect}</div>
                </div>
                <div class="stat-item">
                  <div class="stat-label">Falsch</div>
                  <div class="stat-value incorrect">${wrong}</div>
                </div>
              </div>
              <div class="summary-percent">${percent}%</div>
              <div class="summary-verdict">${passed ? 'Bestanden' : 'Nicht bestanden'}</div>
              <div style="margin-top:15px; font-size:22px; color:#ffd966;">${stars}</div>
            </div>
          </div>
        `;
        questionBodyEl.innerHTML = rightHTML;
      }

      function renderResults() {
        const { totalCorrect, total } = renderResultsLeft();
        renderResultsRight(totalCorrect, total);
      }

      function renderAll() { 
        if (state.showResults) {
          renderResults();
        } else {
          renderPart1();
        }
        updateCompletionMode();
      }

      function resetExam() { 
        if (confirm('Neu beginnen?')) { 
          state.answers = {}; 
          state.showResults = false; 
          state.selectedHeadingId = null;
          resetTimer(); 
          updateCompletionMode();
          renderAll(); 
        } 
      }

      resultBtn.addEventListener('click', () => { 
        state.showResults = !state.showResults; 
        renderAll(); 
      });
      
      resetBtn.addEventListener('click', resetExam);

      window.lesenApp = {
        dragStart: handleDragStart,
        dropOnText: handleDropOnText,
        handleSlotClick,
        handleHeadingClick,
        handleSlotSelectClick,
      };

      startTimer();
      renderAll();
    })();
  </script>
</body>
</html>
